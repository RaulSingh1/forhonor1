<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="For Honor - åpne forsiden.">
  <title>For Honor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --panel: rgba(255, 255, 255, 0.05);
      --text: #f5f5f5;
      --muted: #cfcfcf;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.18);
      --gold-strong: rgba(212, 175, 55, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 36%),
        radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.06), transparent 28%),
        linear-gradient(180deg, #090909 0%, #111 100%);
    }

    .shell {
      width: min(92vw, 560px);
      padding: 34px 28px;
      text-align: center;
      border-radius: 28px;
      border: 1px solid var(--gold-soft);
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.08em;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 22px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid var(--gold-strong);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.22), rgba(212, 175, 55, 0.08));
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      border-color: rgba(212, 175, 55, 0.7);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(212, 175, 55, 0.12));
    }

    .hint {
      display: block;
      margin-top: 14px;
      color: #9f9f9f;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">GitHub Pages</div>
    <h1>FOR HONOR</h1>
    <p>Trykk på knappen under for å åpne forsiden i appen.</p>
    <a class="cta" href="http://forhonor.no:3000/">Gå til forsiden</a>
    <span class="hint">Dette åpner siden som renderes fra <code>views/index.ejs</code>.</span>
  </main>
</body>
</html>
