<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="GitHub Pages placeholder for For Honor.">
  <title>For Honor</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      color: #f5f5f5;
      background:
        radial-gradient(circle at top, rgba(212, 175, 55, 0.12), transparent 42%),
        linear-gradient(180deg, #090909 0%, #111 100%);
    }

    .card {
      width: min(92vw, 560px);
      padding: 32px 28px;
      text-align: center;
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.18);
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      margin-bottom: 14px;
      color: #d4af37;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.08em;
    }

    p {
      margin: 16px 0 0;
      color: #cfcfcf;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">GitHub Pages placeholder</div>
    <h1>FOR HONOR</h1>
    <p>Denne siden finnes bare for statisk hosting. Selve appen kjører separat.</p>
  </main>
</body>
</html>
